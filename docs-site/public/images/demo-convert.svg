<svg xmlns="http://www.w3.org/2000/svg" width="820" height="620" viewBox="0 0 820 620">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .title-bar { fill: #313244; }
      .title-text { fill: #cdd6f4; font-family: 'SF Mono', 'Menlo', 'Monaco', monospace; font-size: 13px; }
      .prompt { fill: #a6e3a1; font-family: 'SF Mono', 'Menlo', 'Monaco', monospace; font-size: 13px; font-weight: bold; }
      .cmd { fill: #cdd6f4; font-family: 'SF Mono', 'Menlo', 'Monaco', monospace; font-size: 13px; }
      .output { fill: #bac2de; font-family: 'SF Mono', 'Menlo', 'Monaco', monospace; font-size: 13px; }
      .heading1 { fill: #89b4fa; font-family: 'SF Mono', 'Menlo', 'Monaco', monospace; font-size: 13px; font-weight: bold; }
      .heading2 { fill: #74c7ec; font-family: 'SF Mono', 'Menlo', 'Monaco', monospace; font-size: 13px; font-weight: bold; }
      .heading3 { fill: #89dceb; font-family: 'SF Mono', 'Menlo', 'Monaco', monospace; font-size: 13px; font-weight: bold; }
      .logic { fill: #f9e2af; font-family: 'SF Mono', 'Menlo', 'Monaco', monospace; font-size: 13px; }
      .table { fill: #a6adc8; font-family: 'SF Mono', 'Menlo', 'Monaco', monospace; font-size: 12px; }
      .diagram { fill: #f5c2e7; font-family: 'SF Mono', 'Menlo', 'Monaco', monospace; font-size: 13px; }
      .dot-red { fill: #f38ba8; }
      .dot-yellow { fill: #f9e2af; }
      .dot-green { fill: #a6e3a1; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="820" height="620" rx="10" ry="10"/>

  <!-- Title bar -->
  <rect class="title-bar" width="820" height="36" rx="10" ry="10"/>
  <rect class="title-bar" x="0" y="20" width="820" height="16"/>

  <!-- Window controls -->
  <circle class="dot-red" cx="20" cy="18" r="6"/>
  <circle class="dot-yellow" cx="40" cy="18" r="6"/>
  <circle class="dot-green" cx="60" cy="18" r="6"/>
  <text class="title-text" x="380" y="22" text-anchor="middle">laddermd -- convert</text>

  <!-- Command -->
  <text class="prompt" x="20" y="65">$</text>
  <text class="cmd" x="35" y="65">laddermd convert self_hold.xml</text>

  <!-- Output -->
  <text class="heading1" x="20" y="100"># Project: SelfHoldTest</text>

  <text class="heading2" x="20" y="130">## Program: Main</text>

  <text class="heading3" x="20" y="160">### Rung 1</text>

  <text class="logic" x="20" y="185">LOGIC: Y001 = (X001 AND X002 OR Y001)</text>

  <text class="table" x="20" y="215">| Device | Type        | LocalId |</text>
  <text class="table" x="20" y="232">|--------|-------------|---------|</text>
  <text class="table" x="20" y="249">| X001   | Contact(NO) | 2       |</text>
  <text class="table" x="20" y="266">| X002   | Contact(NO) | 3       |</text>
  <text class="table" x="20" y="283">| Y001   | Contact(NO) | 4       |</text>
  <text class="table" x="20" y="300">| Y001   | Coil        | 5       |</text>

  <text class="diagram" x="20" y="330">|--[X001]--[X002]--+--(Y001)|</text>
  <text class="diagram" x="20" y="347">|--[Y001]--+        |</text>

  <text class="heading3" x="20" y="387">### Rung 2</text>

  <text class="logic" x="20" y="412">LOGIC: Y001 (RESET) = X003</text>

  <text class="table" x="20" y="442">| Device | Type    | LocalId |</text>
  <text class="table" x="20" y="459">|--------|---------|---------|</text>
  <text class="table" x="20" y="476">| X003   | Contact(NO) | 7  |</text>
  <text class="table" x="20" y="493">| Y001   | Coil(R)     | 8  |</text>

  <text class="diagram" x="20" y="523">|--[X003]--(R Y001)|</text>

  <!-- Prompt at bottom -->
  <text class="prompt" x="20" y="570">$</text>
  <rect fill="#cdd6f4" x="35" y="560" width="8" height="16" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0;0.7" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
