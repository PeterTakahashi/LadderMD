<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .title-bar { fill: #313244; }
      .title-text { fill: #cdd6f4; font-family: 'SF Mono', 'Menlo', 'Monaco', monospace; font-size: 13px; }
      .prompt { fill: #a6e3a1; font-family: 'SF Mono', 'Menlo', 'Monaco', monospace; font-size: 13px; font-weight: bold; }
      .cmd { fill: #cdd6f4; font-family: 'SF Mono', 'Menlo', 'Monaco', monospace; font-size: 13px; }
      .ok { fill: #a6e3a1; font-family: 'SF Mono', 'Menlo', 'Monaco', monospace; font-size: 13px; }
      .info { fill: #bac2de; font-family: 'SF Mono', 'Menlo', 'Monaco', monospace; font-size: 13px; }
      .dot-red { fill: #f38ba8; }
      .dot-yellow { fill: #f9e2af; }
      .dot-green { fill: #a6e3a1; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="720" height="260" rx="10" ry="10"/>

  <!-- Title bar -->
  <rect class="title-bar" width="720" height="36" rx="10" ry="10"/>
  <rect class="title-bar" x="0" y="20" width="720" height="16"/>

  <!-- Window controls -->
  <circle class="dot-red" cx="20" cy="18" r="6"/>
  <circle class="dot-yellow" cx="40" cy="18" r="6"/>
  <circle class="dot-green" cx="60" cy="18" r="6"/>
  <text class="title-text" x="330" y="22" text-anchor="middle">laddermd -- validate</text>

  <!-- Command -->
  <text class="prompt" x="20" y="65">$</text>
  <text class="cmd" x="35" y="65">laddermd validate self_hold.xml</text>

  <!-- Output -->
  <text class="ok" x="20" y="100">Parse OK: 2 rungs found</text>
  <text class="info" x="20" y="125">Devices: 4 contacts, 2 coils, 0 blocks</text>
  <text class="ok" x="20" y="150">Roundtrip OK: all rungs logically equivalent</text>

  <!-- Second command -->
  <text class="prompt" x="20" y="190">$</text>
  <text class="cmd" x="35" y="190">laddermd validate emergency_stop.xml</text>

  <text class="ok" x="20" y="220">Parse OK: 1 rungs found</text>
  <text class="info" x="20" y="240">Devices: 3 contacts, 1 coils, 0 blocks</text>
</svg>
